name: Release DMG

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize and staple DMG"
        required: true
        default: true
        type: boolean

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: read

    env:
      KEYCHAIN_NAME: cmdv-release.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Guard protected ref
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow is restricted to main branch." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          if [[ -z "$KEYCHAIN_PASSWORD" || -z "$CERT_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "Missing signing secrets." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          CERT_PATH="$RUNNER_TEMP/developer_id_application.p12"

          if echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            true
          else
            echo "$CERT_BASE64" | base64 -D > "$CERT_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Build signed + notarized DMG
        if: ${{ inputs.notarize }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/release_signed_notarized_dmg.sh

      - name: Build signed DMG (without notarize)
        if: ${{ !inputs.notarize }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
        run: scripts/release_signed_notarized_dmg.sh --skip-notarize

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmdv-dmg
          path: dist/release/*.dmg
