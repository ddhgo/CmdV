name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: |
          xcodebuild \
            -project "CmdV.xcodeproj" \
            -scheme "CmdV" \
            -configuration Debug \
            -derivedDataPath build/ci/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Test
        run: |
          xcodebuild \
            -project "CmdV.xcodeproj" \
            -scheme "CmdV" \
            -configuration Debug \
            -derivedDataPath build/ci/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
